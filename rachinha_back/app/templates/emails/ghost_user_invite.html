<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <title>Você foi convidado para o Rachinha.com</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000000; font-family: 'Inter', sans-serif; }
        .wrapper { width: 100%; background-color: #000000; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header img { width: 32px; height: 32px; vertical-align: middle; margin-right: 8px; }
        .header .title { font-size: 20px; font-weight: bold; color: #ffffff; display: inline-block; vertical-align: middle; }
        .header .title span { color: #22c55e; }
        .content-card { padding: 40px; text-align: center; }
        .content-card h1 { font-size: 32px; font-weight: 800; color: #ffffff; line-height: 1.2; margin: 0 0 15px; }
        .content-card p { font-size: 16px; color: #a1a1aa; line-height: 1.6; max-width: 450px; margin: 0 auto 30px; }
        .cta-button { display: inline-block; background-color: #22c55e; color: #ffffff; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .footer { padding: 40px 20px 20px; text-align: center; font-size: 12px; color: #52525b; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <img src="https://rachinha.com/assets/logo.svg" alt="Logo">
                <span class="title">rachinha<span>.com</span></span>
            </div>

            <div class="content-card">
                <h1>Você foi convidado para o Rachinha.com</h1>
                <p>Olá, {{ name }}! Um amigo te adicionou em um grupo no Rachinha.com. Crie sua conta para participar dos jogos, conversar com a galera e muito mais!</p>
                <a href="{{ create_account_link }}" class="cta-button">Criar Conta</a>
            </div>
            
            <div class="footer">
                <p>&copy; 2025 Rachinha.com. Todos os direitos reservados.</p>
            </div>
        </div>
    </div>
</body>
</html>
