<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Balança PlayBalancer</title>
  <desc id="desc">Ícone vetorial de uma balança em verde neon, sem texto e com fundo transparente.</desc>

  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6FF5C"/>
      <stop offset="55%" stop-color="#78F12B"/>
      <stop offset="100%" stop-color="#46C818"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- topo e estrutura geométrica -->
    <circle cx="256" cy="72" r="16" fill="#D9FF9B"/>
    <circle cx="190" cy="128" r="11" fill="#D9FF9B"/>
    <circle cx="322" cy="128" r="11" fill="#D9FF9B"/>
    <circle cx="256" cy="164" r="11" fill="#D9FF9B"/>
    <circle cx="150" cy="176" r="14" fill="#D9FF9B"/>
    <circle cx="362" cy="176" r="14" fill="#D9FF9B"/>
    <circle cx="256" cy="208" r="17" fill="#D9FF9B"/>

    <path d="M256 88 L190 128 L150 176"/>
    <path d="M256 88 L322 128 L362 176"/>
    <path d="M190 128 L256 164 L322 128"/>
    <path d="M150 176 L256 208 L362 176"/>
    <path d="M190 128 L256 208"/>
    <path d="M322 128 L256 208"/>
    <path d="M256 88 L256 208"/>

    <!-- braços da balança -->
    <path d="M150 176 L256 208 L362 176"/>

    <!-- hastes dos pratos -->
    <path d="M150 190 L116 260"/>
    <path d="M150 190 L184 260"/>
    <path d="M362 190 L328 260"/>
    <path d="M362 190 L396 260"/>

    <!-- pratos -->
    <path d="M104 260 H196"/>
    <path d="M316 260 H408"/>
    <path d="M108 260 Q150 304 192 260"/>
    <path d="M320 260 Q362 304 404 260"/>

    <!-- coluna central -->
    <path d="M256 226 L232 374 H280 Z" fill="url(#neon)"/>
    <path d="M212 400 H300"/>
    <path d="M188 428 H324"/>
    <path d="M172 448 H340"/>
  </g>
</svg>
